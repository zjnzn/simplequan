exchange:
  mode: hybrid            # simulated=纯内存模拟 | hybrid=真实行情+虚拟撮合
  name: binance           # ccxt.pro 交易所 id
  proxy: "http://127.0.0.1:7897"  # 本地代理，空=直连
  api_key: "xAhuEBwlfBN0PmY52XWDxrVisdf14O5voNyPCeJm4qPFUKUynGDlXjWejz4OBl1I"
  api_secret: "BpkKYp8lOwimo73LwzbpNHIEFpoJ8XSZKLfGaZPhFy72rNzD427sutBKnkxzax0Q"

channel:
  BTC/USDT:
    market: futures
    allocation: 0.3
    intervals:
      1m:
        strategy:
          name: ma_cross_over
          params: { fast: 5, slow: 20 }
          indicators:
            - name: ma
              params: { periods: [5, 20] }
        risk_pre:  { daily_loss_limit: 500, max_drawdown: 0.08 }
        risk_post: { max_per_order_ratio: 0.1, max_leverage: 20 }
      5m:
        strategy:
          name: macd_cross
          params: { fast: 12, slow: 26, signal: 9 }
          indicators:
            - name: macd
              params: { fast: 12, slow: 26, signal: 9 }
        risk_pre:  { daily_loss_limit: 500, max_drawdown: 0.08 }
        risk_post: { max_per_order_ratio: 0.1, max_leverage: 20 }
      1h:
        strategy:
          name: adx_trend
          params: { period: 14 }
          indicators:
            - name: adx
              params: { period: 14 }
        risk_pre:  { daily_loss_limit: 800, max_drawdown: 0.1 }
        risk_post: { max_per_order_ratio: 0.15, max_leverage: 10 }

  ETH/USDT:
    market: futures
    allocation: 0.3
    intervals:
      5m:
        strategy:
          name: rsi_macd
          params: { period: 14 }
          indicators:
            - name: rsi
              params: { period: 14 }
        risk_pre:  { daily_loss_limit: 500, max_drawdown: 0.08 }
        risk_post: { max_per_order_ratio: 0.1, max_leverage: 20 }
      15m:
        strategy:
          name: stoch
          params: { k_period: 14, d_period: 3 }
          indicators:
            - name: stoch
              params: { k_period: 14, d_period: 3 }
        risk_pre:  { daily_loss_limit: 300, max_drawdown: 0.05 }
        risk_post: { max_per_order_ratio: 0.08, max_leverage: 15 }

  BNB/USDT:
    market: futures
    allocation: 0.2
    intervals:
      5m:
        strategy:
          name: bollinger_reversal
          params: { period: 20, std_dev: 2.0 }
          indicators:
            - name: bb
              params: { period: 20, std_dev: 2.0 }
        risk_pre:  { daily_loss_limit: 500, max_drawdown: 0.08 }
        risk_post: { max_per_order_ratio: 0.1, max_leverage: 20 }
      1h:
        strategy:
          name: supertrend
          params: { period: 10, multiplier: 3.0 }
          indicators:
            - name: supertrend
              params: { period: 10, multiplier: 3.0 }
        risk_pre:  { daily_loss_limit: 400, max_drawdown: 0.06 }
        risk_post: { max_per_order_ratio: 0.12, max_leverage: 12 }
